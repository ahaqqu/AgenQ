<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgenQ — mission control</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131824; --panel2: #1a2130; --line: #232c3f;
    --text: #dbe4f0; --dim: #7d8aa0; --accent: #6ea8fe;
    --ok: #3fb96f; --run: #e8b23f; --fail: #e5534b; --idle: #55607a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; padding: 14px 20px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(4px);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 1px; }
  header h1 span { color: var(--accent); }
  .totals { color: var(--dim); font-size: 12px; }
  .totals b { color: var(--text); }
  #filter {
    margin-left: auto; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 11px; padding: 3px 6px;
  }
  #legendbtn {
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 6px; font: inherit; font-size: 11px; padding: 3px 8px; cursor: pointer;
  }
  #legendbtn:hover { color: var(--text); }
  #poll { font-size: 11px; color: var(--dim); }
  .legend {
    display: none; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); padding: 12px 16px; gap: 12px 32px; grid-template-columns: 1fr 1fr; font-size: 12px;
  }
  .legend.show { display: grid; }
  .legend .lhead { color: var(--dim); font-size: 11px; letter-spacing: 1px; margin: 4px 0 6px; }
  .legend .lrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--text); }
  .legend .lrow .status { flex: none; }
  .legend .lrow .ic { flex: none; width: 16px; text-align: center; }
  .legend .lrow .swatch { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .legend .lrow .sw.blue { background: var(--accent); }
  #poll .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 5px; }
  #poll.stale .dot { background: var(--fail); }
  main { padding: 18px 20px 40px; }
  .alert {
    display: none; margin-bottom: 14px; padding: 10px 14px; border: 1px solid var(--fail);
    background: color-mix(in srgb, var(--fail) 12%, var(--panel)); border-radius: 8px; color: #ffb3ae;
  }
  .alert.show { display: block; }
  .alert.livefail { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { border-color: transparent; } }
  .alert .ah { font-size: 11px; letter-spacing: 1px; color: #ffb3ae; margin-bottom: 8px; }
  .agroup { margin-bottom: 10px; }
  .agroup:last-child { margin-bottom: 0; }
  .agroup-head { display: flex; align-items: center; gap: 10px; font-weight: 700; color: #ffb3ae; margin: 4px 0 3px; }
  .aentry { display: flex; align-items: baseline; gap: 10px; padding: 2px 0 2px 14px; font-size: 12px; }
  .aentry .entry { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .aentry .entry:hover { color: #fff; }
  .aentry .etype { color: #ffb3ae; }
  .aentry .ewhen { color: var(--dim); font-size: 11px; }
  .stopbtn {
    margin-left: auto; background: transparent; color: #ffb3ae;
    border: 1px solid var(--fail); border-radius: 6px; font: inherit; font-size: 10px;
    padding: 1px 8px; cursor: pointer; flex: none;
  }
  .stopbtn:hover { background: color-mix(in srgb, var(--fail) 25%, transparent); color: #fff; }
  .stoppedmark { color: var(--ok); font-size: 11px; margin-top: 6px; }
  #toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 10; display: none;
    max-width: 60ch; padding: 10px 14px; border-radius: 8px; font-size: 12px;
    border: 1px solid var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); color: var(--text);
  }
  #toast.show { display: block; }
  #toast.err { border-color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, var(--panel)); }
  .proj { color: var(--accent); font-weight: 700; }
  .root.flash { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .tree { display: flex; flex-direction: column; gap: 14px; }
  .root { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .root > .head {
    padding: 10px 14px; background: var(--panel2); display: flex; gap: 12px; align-items: baseline;
    cursor: default;
  }
  .head .title { font-weight: 700; }
  .head .meta { color: var(--dim); font-size: 11px; }
  .kids { padding: 10px 12px 14px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .kid {
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    padding: 10px 12px; transition: border-color .4s, box-shadow .4s;
  }
  .kid.flash { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .kid .row { display: flex; align-items: center; gap: 8px; }
  .kid .name { font-weight: 700; }
  .kid .model { color: var(--dim); font-size: 11px; margin-left: auto; }
  .status { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); flex: none; }
  .status.running { background: var(--ok); animation: pulse 1.1s ease-in-out infinite; }
  .status.done { background: var(--idle); }
  .status.failed { background: var(--fail); }
  .status.sleep { background: var(--accent); }
  .status.exited { background: transparent; border: 2px solid var(--idle); }
  .aentry.exited { opacity: .55; }
  .livechip { color: var(--run); font-size: 10px; border: 1px solid var(--run); border-radius: 4px; padding: 0 6px; flex: none; }
  .exitedchip { color: var(--dim); font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; flex: none; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
  .nums { display: flex; gap: 14px; margin: 8px 0 6px; font-size: 12px; color: var(--dim); }
  .nums b { color: var(--text); }
  canvas.spark { width: 100%; height: 44px; display: block; }
  .cap { font-size: 10px; color: var(--dim); margin-top: 2px; }
  .cap .over { color: var(--fail); font-weight: 700; }
  .desc { color: var(--dim); font-size: 11px; margin-top: 6px; max-height: 2.6em; overflow: hidden; }
  ul.todos { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; }
  ul.todos li { padding: 1px 0; color: var(--dim); }
  ul.todos li.done { color: var(--ok); text-decoration: line-through; }
  ul.todos li.in_progress { color: var(--text); }
  .err { margin-top: 8px; font-size: 11px; color: #ffb3ae; }
  .ticker { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .ticker .thead { padding: 8px 14px; background: var(--panel2); color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .ticker ul { list-style: none; margin: 0; padding: 8px 14px 10px; font-size: 12px; }
  .ticker li { display: flex; gap: 10px; padding: 1px 0; color: var(--dim); }
  .ticker li .t { color: var(--text); }
  .ticker li.new { animation: slidein .5s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-6px); } }
  .errbar { color: var(--fail); font-size: 12px; padding: 0 20px 10px; }
  .activewrap { display: none; margin-bottom: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .activewrap .thead { display: flex; align-items: center; padding: 8px 14px; background: var(--panel2); color: var(--ok); font-size: 11px; letter-spacing: 1px; cursor: pointer; }
  .activewrap .thead .caret { margin-left: auto; }
  .activewrap.collapsed .activebar { display: none; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 950px) { .duo { grid-template-columns: 1fr; } }
  .duo .ticker { margin-top: 0; }
  .duo .alert { margin-bottom: 0; }
  .activebar { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; }
  .chip {
    display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0;
    border: 1px solid var(--line); border-left: 3px solid var(--ok); border-radius: 8px;
    background: var(--bg); padding: 6px 10px; font-size: 12px;
  }
  .chip .t { font-weight: 700; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .d { color: var(--dim); flex: 1 1 0; min-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .stats { color: var(--dim); font-size: 11px; white-space: nowrap; flex: none; }
  .chip .stats b { color: var(--text); font-weight: 400; }
  .chip .stats b.over { color: var(--fail); font-weight: 700; }
  .chip .ago { color: var(--ok); font-size: 10px; white-space: nowrap; flex: none; }
  .empty { color: var(--dim); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Agen<span>Q</span> — mission control</h1>
  <div class="totals" id="totals"></div>
  <button id="legendbtn" title="what the dots and icons mean">? legend</button>
  <select id="filter" title="filter by project"></select>
  <div id="poll"><span class="dot"></span><span id="poll-text">connecting…</span></div>
</header>
  <main>
  <div class="legend" id="legend"></div>
  <div class="activewrap" id="activewrap">
    <div class="thead" id="activetoggle" title="click to collapse">ACTIVE NOW — activity in the last 5m · idle longer = sleep<span class="caret">▾</span></div>
    <div class="activebar" id="activebar"></div>
  </div>
  <div class="duo">
    <div class="ticker">
      <div class="thead">TOOL TICKER — latest calls across visible sessions</div>
      <ul id="ticker"></ul>
    </div>
    <div class="alert" id="alert">⚠ rate-limited / failed agent detected</div>
  </div>
  <div id="toast"></div>
  <div class="errbar" id="errbar"></div>
  <div class="tree" id="tree"></div>
  <div class="empty" id="empty">no sessions in the window yet — start a ZCode session or a manager run</div>
</main>
<script src="app.js"></script>
</body>
</html>
